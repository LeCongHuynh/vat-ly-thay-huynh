                setRegisteredStudents(prev => ({...prev, [forceChangePassUser.phone]: newPass})); 
                setUser(forceChangePassUser);
                setForceChangePassUser(null);
                showToast("Đổi mật khẩu thành công!", "success");
            };

            const AuthScreen = () => {
                const [authModal, setAuthModal] = useState({ isOpen: false });
                
                const [tMode, setTMode] = useState('login');
                const [tPhone, setTPhone] = useState("");
                const [tPass, setTPass] = useState("");
                
                const [sMode, setSMode] = useState('login');
                const [sPhone, setSPhone] = useState("");
                const [sPass, setSPass] = useState("");
                
                const handleTeacherForgot = () => {
                    setAuthModal({
                        isOpen: true, title: "Khôi phục mật khẩu (Giáo viên)", message: "Mật khẩu của bạn đã được hệ thống đặt lại thành: 00000000",
                        confirmText: "Đóng", onConfirm: () => setAuthModal({isOpen: false}), onCancel: () => setAuthModal({isOpen: false})
                    });
                    setTPass("00000000");
                };

                const handleStudentForgot = () => {
                    if(!sPhone) return showToast("Vui lòng nhập số điện thoại của bạn trước!", "error");
                    setAuthModal({
                        isOpen: true, title: "Yêu cầu cấp lại mật khẩu", 
                        message: `Đã gửi yêu cầu cấp lại mật khẩu cho SĐT ${sPhone} đến Giáo viên. Vui lòng chờ phê duyệt...`,
                        confirmText: "Mô phỏng: GV Đồng ý", cancelText: "Hủy",
                        onConfirm: () => {
                            showToast("Giáo viên đã đồng ý. Mật khẩu mới của bạn là: 00000000", "success");
                            setSPass("00000000");
                            setAuthModal({isOpen: false});
                        },
                        onCancel: () => setAuthModal({isOpen: false})
                    });
                };

                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-blue-50 flex flex-col items-center justify-center p-4">
                        <div className="w-full max-w-5xl mb-12 text-center animate-fadeIn">
                            <div className="inline-block bg-white p-5 rounded-3xl shadow-xl mb-6 border border-indigo-50"><i className="fas fa-graduation-cap text-5xl text-indigo-600"></i></div>
                            <h1 className="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-800 to-blue-600 mb-4 tracking-tight">Hệ thống Quản lý Học tập</h1>
                            <p className="text-gray-500 font-medium text-lg">Đăng nhập hoặc Đăng ký để tiếp tục trải nghiệm hệ thống</p>
                        </div>
                        
                        <div className="w-full max-w-5xl grid md:grid-cols-2 gap-8 lg:gap-12">
                            <div className="bg-white rounded-3xl shadow-2xl overflow-hidden animate-fadeIn border-t-8 border-green-500 hover:shadow-green-100/50 transition duration-300">
                                <div className="bg-gradient-to-b from-green-50 to-white p-8 text-center border-b border-green-100 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-green-100 rounded-full mix-blend-multiply filter blur-2xl opacity-50 translate-x-10 -translate-y-10"></div>
                                    <div className="w-20 h-20 bg-white text-green-600 rounded-2xl flex items-center justify-center text-4xl mx-auto mb-4 shadow-md border border-green-50 relative z-10"><i className="fas fa-user-graduate"></i></div>
                                    <h2 className="text-2xl font-black text-green-800 relative z-10">Khu vực Học sinh</h2>
                                </div>
                                <div className="p-8">
                                    <div className="flex space-x-2 mb-8 bg-gray-50 p-1.5 rounded-xl border border-gray-100">
                                        <button onClick={()=>setSMode('login')} className={`flex-1 py-2.5 rounded-lg font-bold text-sm transition ${sMode==='login'?'bg-white shadow text-green-600 border border-gray-100':'text-gray-500 hover:text-green-500'}`}>Đăng nhập</button>
                                        <button onClick={()=>setSMode('register')} className={`flex-1 py-2.5 rounded-lg font-bold text-sm transition ${sMode==='register'?'bg-white shadow text-green-600 border border-gray-100':'text-gray-500 hover:text-green-500'}`}>Đăng ký</button>
                                    </div>
                                    <form onSubmit={(e)=>{
                                        e.preventDefault(); 
                                        if(sMode==='login') {
                                            handleLogin(sPhone, sPass, 'student'); 
                                        } else {
                                            handleRegister(sPhone, sPass, 'student');
                                        }
                                    }} className="space-y-5">
                                        <div>
                                            <label className="block text-sm font-bold mb-2 text-gray-700">Số điện thoại</label>
                                            <div className="relative">
                                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-phone text-gray-400"></i></div>
                                                <input type="text" value={sPhone} onChange={e=>setSPhone(e.target.value)} className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-10 pr-3 focus:ring-4 focus:ring-green-100 focus:border-green-500 outline-none transition font-medium" required placeholder="Nhập SĐT của bạn" />
                                            </div>
                                        </div>
                                        {sMode === 'register' && <div>
                                            <label className="block text-sm font-bold mb-2 text-gray-700">Họ và Tên</label>
                                            <div className="relative">
                                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-user text-gray-400"></i></div>
                                                <input type="text" className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-10 pr-3 focus:ring-4 focus:ring-green-100 focus:border-green-500 outline-none transition font-medium" required placeholder="Nhập họ và tên" />
                                            </div>
                                        </div>}
                                        <div>
                                            <label className="block text-sm font-bold mb-2 text-gray-700">Mật khẩu</label>
                                            <div className="relative">
                                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-lock text-gray-400"></i></div>
                                                <input type="password" value={sPass} onChange={e=>setSPass(e.target.value)} className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-10 pr-3 focus:ring-4 focus:ring-green-100 focus:border-green-500 outline-none transition font-medium" required placeholder="Nhập mật khẩu" />
                                            </div>
                                        </div>
                                        {sMode === 'login' && <div className="text-right pt-1"><button type="button" onClick={handleStudentForgot} className="text-sm text-green-600 font-bold hover:underline transition">Quên mật khẩu?</button></div>}
                                        <button type="submit" className="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl hover:bg-green-700 transition duration-200 text-lg mt-2">{sMode === 'login' ? 'Đăng nhập Học sinh' : 'Đăng ký Tài khoản'}</button>
                                    </form>
                                </div>
                            </div>

                            <div className="bg-white rounded-3xl shadow-2xl overflow-hidden animate-fadeIn border-t-8 border-indigo-500 hover:shadow-indigo-100/50 transition duration-300">
                                <div className="bg-gradient-to-b from-indigo-50 to-white p-8 text-center border-b border-indigo-100 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-100 rounded-full mix-blend-multiply filter blur-2xl opacity-50 translate-x-10 -translate-y-10"></div>
                                    <div className="w-20 h-20 bg-white text-indigo-600 rounded-2xl flex items-center justify-center text-4xl mx-auto mb-4 shadow-md border border-indigo-50 relative z-10"><i className="fas fa-chalkboard-teacher pr-2"></i></div>
                                    <h2 className="text-2xl font-black text-indigo-800 relative z-10">Khu vực Giáo viên</h2>
                                </div>
                                <div className="p-8">
                                    <div className="flex space-x-2 mb-8 bg-gray-50 p-1.5 rounded-xl border border-gray-100">
                                        <button onClick={()=>setTMode('login')} className={`flex-1 py-2.5 rounded-lg font-bold text-sm transition ${tMode==='login'?'bg-white shadow text-indigo-600 border border-gray-100':'text-gray-500 hover:text-indigo-500'}`}>Đăng nhập</button>
                                        <button onClick={()=>setTMode('register')} className={`flex-1 py-2.5 rounded-lg font-bold text-sm transition ${tMode==='register'?'bg-white shadow text-indigo-600 border border-gray-100':'text-gray-500 hover:text-indigo-500'}`}>Đăng ký</button>
                                    </div>
                                    <form onSubmit={(e)=>{
                                        e.preventDefault(); 
                                        if(tMode==='login') {
                                            handleLogin(tPhone, tPass, 'teacher'); 
                                        } else {
                                            handleRegister(tPhone, tPass, 'teacher');
                                        }
                                    }} className="space-y-5">
                                        <div>
                                            <label className="block text-sm font-bold mb-2 text-gray-700">Tên đăng nhập / SĐT</label>
                                            <div className="relative">
                                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-id-badge text-gray-400"></i></div>
                                                <input type="text" value={tPhone} onChange={e=>setTPhone(e.target.value)} className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-10 pr-3 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition font-medium" required placeholder="admin hoặc SĐT" />
                                            </div>
                                        </div>
                                        {tMode === 'register' && <div>
                                            <label className="block text-sm font-bold mb-2 text-gray-700">Họ và Tên</label>
                                            <div className="relative">
                                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-user text-gray-400"></i></div>
                                                <input type="text" className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-10 pr-3 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition font-medium" required placeholder="Nhập họ và tên" />
                                            </div>
                                        </div>}
                                        <div>
                                            <label className="block text-sm font-bold mb-2 text-gray-700">Mật khẩu</label>
                                            <div className="relative">
                                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-lock text-gray-400"></i></div>
                                                <input type="password" value={tPass} onChange={e=>setTPass(e.target.value)} className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-10 pr-3 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition font-medium" required placeholder="admin hoặc Mật khẩu" />
                                            </div>
                                        </div>
                                        {tMode === 'login' && <div className="text-right pt-1"><button type="button" onClick={handleTeacherForgot} className="text-sm text-indigo-600 font-bold hover:underline transition">Quên mật khẩu?</button></div>}
                                        <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl hover:bg-indigo-700 transition duration-200 text-lg mt-2">{tMode === 'login' ? 'Đăng nhập Giáo viên' : 'Đăng ký Tài khoản'}</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                        <CustomModal {...authModal} />
                    </div>
                );
            };

            if (!dataLoaded) {
                return (
                    <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center">
                        <div className="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
                        <div className="text-gray-500 font-bold text-lg">Đang tải dữ liệu hệ thống...</div>
                    </div>
                );
            }
            
            return (
                <div>
                    {!user && !forceChangePassUser ? <AuthScreen /> : 
                     forceChangePassUser ? <CustomPrompt isOpen={true} title="Vui lòng đổi mật khẩu mới để bảo mật" placeholder="Nhập mật khẩu mới của bạn..." initialValue="" onConfirm={handleStudentChangePass} onCancel={()=>setForceChangePassUser(null)} /> :
                     user.role === 'teacher' ? <TeacherManage classTree={classTree} setClassTree={setClassTree} lessonTree={lessonTree} setLessonTree={setLessonTree} onLogout={()=>setUser(null)} showToast={showToast} /> :
                     user.isFirstTime ? <StudentSetup phone={user.phone} classTree={classTree} onComplete={(details) => setUser({...user, ...details, isFirstTime: false})} /> :
                     <StudentView user={user} classTree={classTree} setClassTree={setClassTree} lessonTree={lessonTree} onLogout={()=>setUser(null)} />
                    }
                    
                    {toast.show && (
                        <div className={`fixed bottom-6 right-6 px-6 py-4 rounded-xl shadow-2xl font-bold flex items-center animate-fadeIn z-[10000] text-white ${toast.type === 'success' ? 'bg-gray-900 border-l-4 border-green-500' : 'bg-red-600'}`}>
                            <i className={`fas ${toast.type === 'success' ? 'fa-check-circle text-green-400' : 'fa-exclamation-circle'} mr-3 text-2xl`}></i>
                            {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
