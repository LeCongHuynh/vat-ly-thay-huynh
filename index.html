                                                                <span className="flex-1 truncate pr-2"><i className={`fas fa-file-alt mr-2 ${selectedLesson?.id === lesson.id ? 'text-indigo-500' : 'text-gray-400'}`}></i> {lesson.name}</span>
                                                                <div className="flex space-x-3 opacity-0 group-hover:opacity-100 transition">
                                                                    <button onClick={(e)=>{e.stopPropagation(); handleEditLessonName(chapter, idx, lesson.name);}} className="text-blue-500 hover:text-blue-700" title="Sửa tên bài"><i className="fas fa-edit"></i></button>
                                                                    <button onClick={(e)=>{e.stopPropagation(); handleDeleteLesson(chapter, idx);}} className="text-red-500 hover:text-red-700" title="Xóa bài"><i className="fas fa-trash"></i></button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                        {lessonTree[lessonGrade][chapter].length === 0 && <div className="text-center text-xs text-gray-400 py-3 italic">Chưa có bài học nào</div>}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                        {Object.keys(lessonTree[lessonGrade]).length === 0 && <p className="text-sm text-gray-400 text-center py-4">Chưa có dữ liệu chương trình cho khối này.</p>}
                                    </div>
                                </div>
                                <div className="w-full md:w-2/3 bg-white p-4 md:p-6 rounded-xl shadow-sm border flex flex-col md:h-[calc(100vh-140px)] overflow-y-auto custom-scrollbar">
                                    {selectedLesson ? (
                                        <div className="space-y-6 animate-fadeIn">
                                            <h2 className="text-2xl font-bold text-indigo-900 border-b pb-3">{selectedLesson.name}</h2>
                                            
                                            <div className="border rounded-xl overflow-hidden bg-blue-50/30">
                                                <div className="bg-blue-100 p-3 flex justify-between items-center border-b border-blue-200">
                                                    <h4 className="font-bold text-blue-800"><i className="fas fa-book mr-2"></i> 1. Tài liệu Lý thuyết</h4>
                                                    <button onClick={()=>setResourceModalConfig({isOpen: true, title: "Thêm tài liệu Lý thuyết", onConfirm: (data) => {
                                                        const newTree = {...lessonTree};
                                                        if(!newTree[lessonGrade][selectedLesson.chapter][selectedLesson.lessonIndex].theoryLinks) newTree[lessonGrade][selectedLesson.chapter][selectedLesson.lessonIndex].theoryLinks = [];
                                                        newTree[lessonGrade][selectedLesson.chapter][selectedLesson.lessonIndex].theoryLinks.push(data);
                                                        setLessonTree(newTree); setSelectedLesson({...newTree[lessonGrade][selectedLesson.chapter][selectedLesson.lessonIndex], chapter: selectedLesson.chapter, lessonIndex: selectedLesson.lessonIndex});
                                                        closeAllModals(); showToast("Đã thêm tài liệu!");
                                                    }})} className="bg-white border border-blue-300 hover:bg-blue-50 text-blue-700 px-3 py-1 rounded shadow-sm text-sm font-bold transition">+ Thêm Tài Liệu</button>
                                                </div>
                                                <div className="p-4 space-y-2">
                                                    {(selectedLesson.theoryLinks || []).length > 0 ? selectedLesson.theoryLinks.map((link, idx) => (
                                                        <div key={link.id} className="flex justify-between items-center bg-white border p-3 rounded-lg hover:shadow-sm transition group">
                                                            <div className="overflow-hidden pr-4">
                                                                <p className="font-bold text-sm text-gray-800 truncate">{link.title}</p>
                                                                <a href={link.url} target="_blank" className="text-xs text-blue-500 truncate block hover:underline">{link.url}</a>
                                                            </div>
                                                            <button onClick={()=>{
                                                                const newTree = {...lessonTree};
                                                                newTree[lessonGrade][selectedLesson.chapter][selectedLesson.lessonIndex].theoryLinks.splice(idx, 1);
                                                                setLessonTree(newTree); setSelectedLesson({...newTree[lessonGrade][selectedLesson.chapter][selectedLesson.lessonIndex], chapter: selectedLesson.chapter, lessonIndex: selectedLesson.lessonIndex});
                                                                showToast("Đã xóa tài liệu!");
                                                            }} className="text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 p-2 transition bg-red-50 rounded-full"><i className="fas fa-trash"></i></button>
                                                        </div>
                                                    )) : <p className="text-sm text-gray-400 italic text-center py-2">Chưa có tài liệu lý thuyết nào.</p>}
                                                </div>
                                            </div>

                                            <div className="border rounded-xl overflow-hidden bg-orange-50/30">
                                                <div className="bg-orange-100 p-3 flex justify-between items-center border-b border-orange-200">
                                                    <h4 className="font-bold text-orange-800"><i className="fas fa-flask mr-2"></i> 2. Link Thí nghiệm</h4>
                                                    <button onClick={()=>setResourceModalConfig({isOpen: true, title: "Thêm link Thí nghiệm", onConfirm: (data) => {
                                                        const newTree = {...lessonTree};
                                                        if(!newTree[lessonGrade][selectedLesson.chapter][selectedLesson.lessonIndex].simLinks) newTree[lessonGrade][selectedLesson.chapter][selectedLesson.lessonIndex].simLinks = [];
                                                        newTree[lessonGrade][selectedLesson.chapter][selectedLesson.lessonIndex].simLinks.push(data);
                                                        setLessonTree(newTree); setSelectedLesson({...newTree[lessonGrade][selectedLesson.chapter][selectedLesson.lessonIndex], chapter: selectedLesson.chapter, lessonIndex: selectedLesson.lessonIndex});
                                                        closeAllModals(); showToast("Đã thêm link thí nghiệm!");
                                                    }})} className="bg-white border border-orange-300 hover:bg-orange-50 text-orange-700 px-3 py-1 rounded shadow-sm text-sm font-bold transition">+ Thêm Thí Nghiệm</button>
                                                </div>

                                {statSubTab === 'byStudent' && (
                                    <div className="animate-fadeIn">

                                                {availableStatGrades.map(g => <option key={g} value={g}>{g}</option>)}

                                                {availableStatLessons.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}

                                            <div className="flex flex-col space-y-8">

                                                            <thead className="bg-gray-100 border-b">
                                                                <tr>
                                                                    <th className="p-3 w-12 text-center text-gray-600">STT</th>

                                                                    <th className="p-3 text-gray-600">Thời gian các lượt</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {availableStatStudents.map((s, i) => {
                                                                    const result = s.results?.[quiz.id];

                                                                        attempts = result.attempts;
                                                                        highest = result.highest.toFixed(1);
                                                                        avg = (result.scores.reduce((a,b)=>a+b, 0) / attempts).toFixed(1);
                                                                        times = result.times.join(', ');
                                                                    }
                                                                    
                                                                    return (
                                                                        <tr key={s.id} className="border-b hover:bg-gray-50 transition">
                                                                            <td className="p-3 text-center text-gray-500">{i + 1}</td>
                                                                            <td className="p-3 font-bold text-gray-800">{s.name}</td>
                                                                            <td className="p-3 text-center font-bold text-blue-600">{avg}</td>
                                                                            <td className="p-3 text-center font-bold text-green-600">{highest}</td>
                                                                            <td className="p-3 text-center">{attempts > 0 ? <span className="bg-gray-200 px-2 rounded-full font-bold text-xs">{attempts}</span> : '-'}</td>
                                                                            <td className="p-3 text-gray-600 text-xs italic">{times}</td>
                                                                        </tr>
                                                                    );
                                                                })}
                                                                {availableStatStudents.length === 0 && <tr><td colSpan="6" className="text-center p-6 text-gray-400 italic">Chưa có học sinh trong lớp này</td></tr>}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : <div className="text-center text-gray-500 py-12 border rounded-lg bg-gray-50 border-dashed">Bài học này hiện chưa có Đề kiểm tra nào được tạo.</div>}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    <CustomModal {...modalConfig} onCancel={closeAllModals} />

                    <AddClassModal isOpen={addClassConfig.isOpen} title="Thêm Lớp Mới" grades={Object.keys(classTree)} initialGrade={selectedGrade} onCancel={closeAllModals} onConfirm={(g, val) => {
                        if(val && !classTree[g][val]) {
                            setClassTree(prev => ({...prev, [g]: {...prev[g], [val]: []}}));
                            setSelectedGrade(g);
                            setSelectedClass(val);
                            showToast("Thêm lớp thành công!");
                        } else if (classTree[g][val]) {
                            showToast("Lớp đã tồn tại trong khối này!", "error");
                        }
                        closeAllModals();
                    }} />
                    <AddResourceModal {...resourceModalConfig} onCancel={closeAllModals} />

                        const newTree = JSON.parse(JSON.stringify(lessonTree));
                        newTree[lessonGrade][c][i].quizzes[qIdx].assignedClasses = selectedClasses;
                        setLessonTree(newTree);
                        if (selectedLesson && selectedLesson.chapter === c && selectedLesson.lessonIndex === i) {
                            setSelectedLesson({...newTree[lessonGrade][c][i], chapter: c, lessonIndex: i});
                        }
                        closeAllModals(); showToast("Đã cập nhật danh sách lớp được giao đề!");
                    }} />
                    <QuizImportModal isOpen={quizImportConfig.isOpen} showToast={showToast} onCancel={()=>setQuizImportConfig({isOpen: false})} onConfirmImport={(parsedQuiz) => {
                        setQuizImportConfig({isOpen: false});
                        setQuizBuilderState({isOpen: true, data: parsedQuiz, path: quizImportConfig.path});
                    }}/>
                    <EditStudentModal {...editStudentConfig} onCancel={closeAllModals} onConfirm={(n,p)=>{
                        const newTree = {...classTree}; const cls = newTree[selectedGrade][selectedClass];
                        const idx = cls.findIndex(s => s.id === editStudentConfig.student.id);
                        if(idx > -1) { cls[idx].name = n; cls[idx].phone = p; setClassTree(newTree); showToast("Đã cập nhật!"); }
                        closeAllModals();
                    }}/>
                    <QuizBuilderOverlay isOpen={quizBuilderState.isOpen} initialData={quizBuilderState.data} onClose={()=>setQuizBuilderState({isOpen:false})} showToast={showToast} onSave={(data)=>{
                        const {c, i, qIdx} = quizBuilderState.path;
                        const newTree = JSON.parse(JSON.stringify(lessonTree)); 
                        
                        if (!newTree[lessonGrade][c][i].quizzes) newTree[lessonGrade][c][i].quizzes = [];
                        
                        if (qIdx === -1) {
                            data.id = generateId();
                            newTree[lessonGrade][c][i].quizzes.push(data);
                        } else {
                            newTree[lessonGrade][c][i].quizzes[qIdx] = data;
                        }
                        
                        setLessonTree(newTree); 
                        if (selectedLesson && selectedLesson.chapter === c && selectedLesson.lessonIndex === i) {
                            setSelectedLesson({...newTree[lessonGrade][c][i], chapter: c, lessonIndex: i});
                        }
                        showToast("Đã lưu đề!");
                    }} />
                </div>
            );
        };

        const StudentSetup = ({ phone, classTree, onComplete }) => {
            const [grade, setGrade] = useState('');
            const [cls, setCls] = useState('');
            const [studentId, setStudentId] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            const grades = Object.keys(classTree);
            const classes = grade ? Object.keys(classTree[grade]) : [];
            const students = (grade && cls) ? classTree[grade][cls].filter(s => s.phone === phone) : [];

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!grade || !cls || !studentId) {
                    setErrorMsg("Vui lòng chọn đầy đủ thông tin Khối, Lớp và Tên!");
                    return;
                }
                const student = students.find(s => s.id === studentId);
                const sName = student ? student.name : "Học sinh";
                onComplete({ grade, cls, name: sName, studentId });
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 flex items-center justify-center p-4 animate-fadeIn">
                    <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border-t-4 border-green-500">
                        <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-inner"><i className="fas fa-user-check"></i></div>
                        <h2 className="text-2xl font-bold text-green-800 mb-2 text-center">Xác nhận thông tin</h2>
                        <p className="text-sm text-gray-500 text-center mb-6">Chào mừng! Vui lòng chọn đúng lớp và tên của bạn để vào không gian học tập.</p>
                        
                        {errorMsg && (
                            <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 flex items-center">
                                <i className="fas fa-exclamation-circle mr-2"></i> {errorMsg}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-sm font-bold mb-1 text-gray-700">1. Khối học</label>
                                <select value={grade} onChange={e=>{setGrade(e.target.value); setCls(''); setStudentId(''); setErrorMsg('');}} className="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-green-500 outline-none transition bg-gray-50" required>
                                    <option value="">-- Chọn Khối --</option>
                                    {grades.map(g => <option key={g} value={g}>{g}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-bold mb-1 text-gray-700">2. Lớp học</label>
                                <select value={cls} onChange={e=>{setCls(e.target.value); setStudentId(''); setErrorMsg('');}} className="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-green-500 outline-none transition bg-gray-50" required disabled={!grade}>
                                    <option value="">-- Chọn Lớp --</option>
                                    {classes.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-bold mb-1 text-gray-700">3. Họ và Tên</label>
                                <select value={studentId} onChange={e=>{setStudentId(e.target.value); setErrorMsg('');}} className="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-green-500 outline-none transition bg-gray-50" required disabled={!cls}>
                                    <option value="">-- Chọn Tên của bạn --</option>
                                    {students.length > 0 ? (
                                        students.map(s => <option key={s.id} value={s.id}>{s.name} (SĐT: {s.phone})</option>)
                                    ) : (
                                        cls && <option value="" disabled>Không tìm thấy SĐT {phone} ở lớp này</option>
                                    )}
                                </select>
                            </div>
                            <button type="submit" className="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-green-700 transition mt-6 flex justify-center items-center text-lg">
                                <i className="fas fa-door-open mr-2"></i> Bắt đầu học
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const StudentQuizPlayer = ({ quiz, initialReviewMode = false, previousAnswers = null, onClose, onComplete }) => {
            const defaultAnswers = { part1: {}, part2: {}, part3: {} };
            const [answers, setAnswers] = useState(previousAnswers ? { ...defaultAnswers, ...previousAnswers } : defaultAnswers);
            const answersRef = useRef(answers);
            const [timeLeft, setTimeLeft] = useState((quiz.timeLimit || 45) * 60);
            const [isSubmitted, setIsSubmitted] = useState(initialReviewMode);
            const [isReviewMode, setIsReviewMode] = useState(initialReviewMode);
            const [scoreResult, setScoreResult] = useState(null);
            const [activeTab, setActiveTab] = useState('part1');
            const [showConfirmModal, setShowConfirmModal] = useState({ isOpen: false, type: null });

            // Các hàm kiểm tra tính đúng/sai để phục vụ hiển thị Review Mode
            const isP1Correct = (q) => answers.part1 && answers.part1[q.id] === q.correctOption;
            
            const isP2Correct = (q) => {
                if (!answers.part2 || !answers.part2[q.id]) return false;
                let correctCount = 0;
                q.subQuestions.forEach((sq, sIdx) => {
                    if (answers.part2[q.id][sIdx] === sq.isTrue) correctCount++;
                });
                return correctCount === 4; // Chỉ chuyển xanh ô số thứ tự nếu đúng cả 4 ý
            };
            
            const isP3Correct = (q) => {
                if (!answers.part3) return false;
                const studentAns = String(answers.part3[q.id] || "").trim().replace(',', '.');
                const correctAns = String(q.shortAnswer || "").trim().replace(',', '.');
                return studentAns !== "" && studentAns === correctAns;
            };

            useEffect(() => {
                answersRef.current = answers;
            }, [answers]);

            useEffect(() => {
                if (isSubmitted) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => Math.max(0, prev - 1));
                }, 1000);
                return () => clearInterval(timer);
            }, [isSubmitted]);

            useEffect(() => {
                if (timeLeft === 0 && !isSubmitted) {
                    handleSubmit();
                }
            }, [timeLeft, isSubmitted]);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60); const s = secs % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const handleSubmit = () => {
                let totalScore = 0;
                let maxPossibleScore = 0;
                const p1Score = quiz.part1Score || 0.25;
                const p2Scores = quiz.part2Scores || { s1: 0.1, s2: 0.25, s3: 0.5, s4: 1.0 };
                const p3Score = quiz.part3Score || 0.5;

                const currentAnswers = answersRef.current;

                (quiz.questions?.part1 || []).forEach((q) => {
                    maxPossibleScore += p1Score;
                    if (currentAnswers.part1[q.id] === q.correctOption) totalScore += p1Score;
                });

                (quiz.questions?.part2 || []).forEach((q) => {
                    maxPossibleScore += p2Scores.s4;
                    let correctCount = 0;
                    q.subQuestions.forEach((sq, sIdx) => {
                        if (currentAnswers.part2[q.id] && currentAnswers.part2[q.id][sIdx] === sq.isTrue) correctCount++;
                    });
                    if (correctCount === 1) totalScore += p2Scores.s1;
                    if (correctCount === 2) totalScore += p2Scores.s2;
                    if (correctCount === 3) totalScore += p2Scores.s3;
                    if (correctCount === 4) totalScore += p2Scores.s4;
                });

                (quiz.questions?.part3 || []).forEach((q) => {
                    maxPossibleScore += p3Score;
                    const studentAns = String(currentAnswers.part3[q.id] || "").trim().replace(',', '.');
                    const correctAns = String(q.shortAnswer || "").trim().replace(',', '.');
                    if (studentAns !== "" && studentAns === correctAns) totalScore += p3Score;
                });

                setShowConfirmModal({ isOpen: false, type: null });
                setScoreResult({ score: totalScore, max: maxPossibleScore });
                setIsSubmitted(true);
                
                if (onComplete) {
                    onComplete({ quizId: quiz.id, score: totalScore, maxScore: maxPossibleScore, answers: currentAnswers });
                }
            };

            if (isSubmitted && scoreResult && !isReviewMode) {
                return (
                    <div className="fixed inset-0 bg-gray-100 z-[9999] flex items-center justify-center animate-fadeIn p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border-t-4 border-green-500">
                            <i className="fas fa-check-circle text-6xl text-green-500 mb-6 drop-shadow-md"></i>
                            <h2 className="text-3xl font-black text-gray-800 mb-2">Hoàn thành!</h2>
                            <p className="text-gray-500 mb-6 font-medium">Kết quả của bạn đã được ghi nhận vào hệ thống.</p>
                            <div className="bg-green-50 p-6 rounded-xl mb-8 border border-green-100 shadow-inner">
                                <span className="block text-sm text-green-700 font-bold mb-2 uppercase tracking-wider">ĐIỂM SỐ CỦA BẠN (Hệ Số 10)</span>
                                <span className="text-6xl font-black text-green-600">{((scoreResult.score / scoreResult.max) * 10).toFixed(2)}</span>
                            </div>
                            <button onClick={() => setIsReviewMode(true)} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-lg mb-3 flex items-center justify-center">
                                <i className="fas fa-search mr-2"></i> Xem Lại Bài Làm & Lời Giải
                            </button>
                            <button onClick={onClose} className="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3.5 rounded-xl transition shadow text-lg flex items-center justify-center">
                                <i className="fas fa-home mr-2"></i> Về Không Gian Học Tập
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="fixed inset-0 bg-gray-50 z-[9999] flex flex-col animate-fadeIn">
                    {showConfirmModal.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 z-[10000] flex items-center justify-center animate-fadeIn p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center">
                                <div className={`w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 ${showConfirmModal.type === 'submit' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                                    <i className={`fas ${showConfirmModal.type === 'submit' ? 'fa-paper-plane' : 'fa-sign-out-alt'}`}></i>
                                </div>
                                <h3 className="text-2xl font-bold text-gray-800 mb-2">Xác nhận</h3>
                                <p className="text-gray-600 mb-8 font-medium">
                                    {showConfirmModal.type === 'submit' 
                                        ? 'Bạn có chắc chắn muốn nộp bài ngay bây giờ? Bạn không thể thay đổi sau khi nộp.' 
                                        : 'Nếu thoát bây giờ, bài làm của bạn sẽ KHÔNG được lưu lại. Chắc chắn muốn thoát?'}
                                </p>
                                <div className="flex justify-center space-x-4">
                                    <button onClick={() => setShowConfirmModal({ isOpen: false, type: null })} className="px-6 py-2.5 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl font-bold transition flex-1">Hủy</button>
                                    <button onClick={() => {
                                        if (showConfirmModal.type === 'submit') handleSubmit();
                                        if (showConfirmModal.type === 'exit') onClose();
                                    }} className={`px-6 py-2.5 text-white rounded-xl font-bold transition shadow flex-1 ${showConfirmModal.type === 'submit' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}>
                                        Đồng ý
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-white shadow-sm md:shadow-md p-2 md:p-4 flex justify-between items-center z-10 sticky top-0 border-b">
                        <div className="flex items-center space-x-2 md:space-x-4">
                            <button onClick={() => isReviewMode ? onClose() : setShowConfirmModal({ isOpen: true, type: 'exit' })} className="text-gray-400 hover:text-red-500 transition p-1.5 md:p-2 bg-gray-50 rounded-full hover:bg-red-50"><i className="fas fa-times text-lg md:text-xl"></i></button>
                            <h2 className="font-bold text-sm md:text-lg text-gray-800 hidden sm:block truncate max-w-[150px] md:max-w-none">{quiz.title}</h2>
                        </div>
                        <div className="flex items-center space-x-2 md:space-x-4">
                            {isReviewMode && quiz.generalSolutionLink && (
                                <a href={quiz.generalSolutionLink} target="_blank" className="bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-sm font-bold transition flex items-center border border-blue-200">
                                    <i className="fas fa-video mr-1 md:mr-2"></i> <span className="hidden sm:inline">Giải Toàn Đề</span>
                                </a>
                            )}
                            {!isReviewMode ? (
                                <>
                                    <div className={`px-2 py-1 md:px-4 md:py-2 rounded-lg font-bold flex items-center shadow-inner ${timeLeft < 300 ? 'bg-red-100 text-red-600 animate-pulse border border-red-200' : 'bg-gray-100 text-gray-700 border border-gray-200'}`}>
                                        <i className="far fa-clock mr-1 md:mr-2 text-sm md:text-lg"></i> <span className="text-sm md:text-lg tracking-wider">{formatTime(timeLeft)}</span>
                                    </div>
                                    <button onClick={() => setShowConfirmModal({ isOpen: true, type: 'submit' })} className="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 md:px-5 md:py-2.5 rounded-lg text-sm md:text-base font-bold shadow-sm md:shadow-md transition flex items-center">
                                        <i className="fas fa-paper-plane mr-1 md:mr-2"></i> <span className="hidden sm:inline">Nộp bài</span>
                                    </button>
                                </>
                            ) : (
                                <div className="px-4 py-2 bg-indigo-100 text-indigo-800 rounded-lg font-bold text-sm md:text-base border border-indigo-200">
                                    <i className="fas fa-search mr-2"></i> Chế độ xem lại
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="flex-1 overflow-hidden flex flex-col md:flex-row max-w-7xl mx-auto w-full p-2 md:p-4 gap-2 md:gap-6">
                        <div className="w-full md:w-1/4 bg-white rounded-xl md:rounded-2xl shadow-sm border p-2 md:p-4 flex flex-col shrink-0 h-auto md:h-full">
                            <h3 className="hidden md:block font-bold text-gray-700 mb-4 pb-2 border-b uppercase text-sm tracking-wider">Danh sách câu hỏi</h3>
                            <div className="flex space-x-1 md:space-x-2 border-b pb-2 md:pb-3 mb-2 md:mb-4">
                                <button onClick={()=>setActiveTab('part1')} className={`flex-1 py-1 md:py-2 text-[10px] md:text-sm font-bold rounded-md md:rounded-lg transition ${activeTab==='part1'?'bg-indigo-600 text-white shadow':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>P.1 ({quiz.questions?.part1?.length||0})</button>
                                <button onClick={()=>setActiveTab('part2')} className={`flex-1 py-1 md:py-2 text-[10px] md:text-sm font-bold rounded-md md:rounded-lg transition ${activeTab==='part2'?'bg-indigo-600 text-white shadow':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>P.2 ({quiz.questions?.part2?.length||0})</button>
                                <button onClick={()=>setActiveTab('part3')} className={`flex-1 py-1 md:py-2 text-[10px] md:text-sm font-bold rounded-md md:rounded-lg transition ${activeTab==='part3'?'bg-indigo-600 text-white shadow':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>P.3 ({quiz.questions?.part3?.length||0})</button>
                            </div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar pr-1 max-h-[76px] md:max-h-none">
                                <div className="grid grid-cols-9 md:grid-cols-4 lg:grid-cols-5 gap-1 md:gap-2">
                                    {(quiz.questions?.[activeTab] || []).map((q, idx) => {
                                        let isAnswered = false;
                                        if (activeTab === 'part1') isAnswered = answers.part1[q.id] !== undefined;
                                        if (activeTab === 'part2') isAnswered = answers.part2[q.id] && answers.part2[q.id].filter(x=>x!==null).length === 4;
                                        if (activeTab === 'part3') isAnswered = (answers.part3[q.id]||"").trim() !== "";
                                        
                                        let btnClass = isAnswered ? 'bg-indigo-500 text-white border-indigo-600' : 'bg-white text-gray-600 border-gray-200 hover:border-indigo-300';
                                        
                                        if (isReviewMode) {
                                            let isCorrect = false;
                                            if (activeTab === 'part1') isCorrect = isP1Correct(q);
                                            if (activeTab === 'part2') isCorrect = isP2Correct(q);
                                            if (activeTab === 'part3') isCorrect = isP3Correct(q);
                                            btnClass = isCorrect ? 'bg-green-500 text-white border-green-600' : 'bg-red-500 text-white border-red-600';
                                        }

                                        return (
                                            <a key={q.id} href={`#q-${activeTab}-${idx}`} className={`h-7 md:h-10 flex items-center justify-center rounded md:rounded-lg border md:border-2 text-[10px] md:text-sm font-bold transition hover:opacity-80 shadow-sm ${btnClass}`}>
                                                {idx + 1}
                                            </a>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        <div className="w-full md:w-3/4 bg-white rounded-xl md:rounded-2xl shadow-sm border p-3 md:p-8 overflow-y-auto h-full scroll-smooth custom-scrollbar relative">
                            <div className="space-y-8 mt-4 md:mt-0">
                                {(quiz.questions?.[activeTab] || []).map((q, idx) => (
                                    <div key={q.id} id={`q-${activeTab}-${idx}`} className="p-5 md:p-6 bg-gray-50 rounded-2xl border border-gray-200 shadow-sm scroll-mt-24">
                                        <div className="font-bold text-lg mb-4 flex items-start"><span className="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-lg mr-3 shadow-sm whitespace-nowrap">Câu {idx + 1}</span> <div className="flex-1 mt-1 leading-relaxed"><LatexPreview text={q.content} /></div></div>
                                        {q.imageUrl && <div className="mb-5 flex justify-center"><img src={q.imageUrl} alt={`Hình ảnh câu ${idx+1}`} className="max-w-full h-auto rounded-xl shadow-md border bg-white p-1" /></div>}
                                        
                                        {activeTab === 'part1' && (
                                            <div className="space-y-3 mt-5">
                                                {q.options.map((opt, oIdx) => (
                                                    <label key={oIdx} className={`flex items-center p-4 rounded-xl border-2 cursor-pointer transition-all ${
                                                        isReviewMode
                                                            ? (q.correctOption === oIdx ? 'bg-green-100 border-green-500 shadow-md' : (answers.part1[q.id] === oIdx ? 'bg-red-100 border-red-500 shadow-sm' : 'bg-white border-gray-200 opacity-60'))
                                                            : (answers.part1[q.id] === oIdx ? 'bg-indigo-50 border-indigo-500 shadow-md' : 'bg-white border-gray-200 hover:border-indigo-300 hover:bg-gray-50')
                                                    }`}>
                                                        <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center mr-4 shrink-0 transition ${
                                                            isReviewMode
                                                                ? (q.correctOption === oIdx ? 'border-green-600 bg-green-600' : (answers.part1[q.id] === oIdx ? 'border-red-600 bg-red-600' : 'border-gray-300 bg-gray-100'))
                                                                : (answers.part1[q.id] === oIdx ? 'border-indigo-600 bg-indigo-600' : 'border-gray-400 bg-white')
                                                        }`}>
                                                            {answers.part1[q.id] === oIdx && <div className="w-2 h-2 rounded-full bg-white"></div>}
                                                        </div>
                                                        <span className={`font-black w-8 shrink-0 text-lg ${
                                                            isReviewMode 
                                                                ? (q.correctOption === oIdx ? 'text-green-700' : (answers.part1[q.id] === oIdx ? 'text-red-700' : 'text-gray-500'))
                                                                : (answers.part1[q.id] === oIdx ? 'text-indigo-700' : 'text-gray-500')
                                                        }`}>{['A', 'B', 'C', 'D'][oIdx]}.</span>
                                                        <div className="flex-1 text-gray-800"><LatexPreview text={opt} /></div>
                                                        {isReviewMode && q.correctOption === oIdx && <i className="fas fa-check-circle text-green-600 text-2xl ml-2 shrink-0"></i>}
                                                        {isReviewMode && answers.part1[q.id] === oIdx && q.correctOption !== oIdx && <i className="fas fa-times-circle text-red-600 text-2xl ml-2 shrink-0"></i>}
                                                    </label>
                                                ))}
                                            </div>
                                        )}

                                        {activeTab === 'part2' && (
                                            <div className="space-y-4 mt-5">
                                                {q.subQuestions.map((sq, sIdx) => {
                                                    const currentVal = answers.part2[q.id] ? answers.part2[q.id][sIdx] : null;
                                                    return (
                                                        <div key={sIdx} className="flex flex-col md:flex-row md:items-center p-4 bg-white rounded-xl border-2 border-gray-200 shadow-sm gap-4">
                                                            <span className="font-black w-8 shrink-0 text-lg text-gray-500 hidden md:block">{['a', 'b', 'c', 'd'][sIdx]}.</span>
                                                            <div className="flex-1 text-gray-800 leading-relaxed"><LatexPreview text={sq.text} /></div>
                                                            <div className="flex space-x-2 shrink-0 border-t md:border-t-0 pt-3 md:pt-0 flex-col sm:flex-row gap-2 sm:gap-0 items-center">
                                                                <div className="flex space-x-2 w-full">
                                                                    <button disabled={isReviewMode} onClick={() => setAnswers(prev => { const arr = prev.part2[q.id] ? [...prev.part2[q.id]] : [null,null,null,null]; arr[sIdx] = true; return {...prev, part2: {...prev.part2, [q.id]: arr}}; })} className={`flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-sm transition shadow-sm ${
                                                                        isReviewMode 
                                                                            ? (sq.isTrue === true ? 'bg-green-500 text-white border border-green-600' : (currentVal === true ? 'bg-red-500 text-white border border-red-600' : 'bg-gray-100 text-gray-400'))
                                                                            : (currentVal === true ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-indigo-100 hover:text-indigo-700')
                                                                    }`}>ĐÚNG</button>
                                                                    <button disabled={isReviewMode} onClick={() => setAnswers(prev => { const arr = prev.part2[q.id] ? [...prev.part2[q.id]] : [null,null,null,null]; arr[sIdx] = false; return {...prev, part2: {...prev.part2, [q.id]: arr}}; })} className={`flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-sm transition shadow-sm ${
                                                                        isReviewMode 
                                                                            ? (sq.isTrue === false ? 'bg-green-500 text-white border border-green-600' : (currentVal === false ? 'bg-red-500 text-white border border-red-600' : 'bg-gray-100 text-gray-400'))
                                                                            : (currentVal === false ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-red-100 hover:text-red-700')
                                                                    }`}>SAI</button>
                                                                </div>
                                                                {isReviewMode && currentVal !== sq.isTrue && currentVal !== null && <p className="text-red-500 font-bold text-xs mt-2 sm:mt-0 sm:ml-3 shrink-0"><i className="fas fa-times mr-1"></i> Sai</p>}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}

                                        {activeTab === 'part3' && (
                                            <div className="mt-5 p-2 flex flex-col md:flex-row gap-4 items-start">
                                                <div className="w-full md:max-w-md">
                                                    <input disabled={isReviewMode} type="text" placeholder="Nhập đáp án số của bạn vào đây..." value={answers.part3[q.id] || ""} onChange={(e) => setAnswers(prev => ({...prev, part3: {...prev.part3, [q.id]: e.target.value}}))} className={`w-full border-2 p-4 rounded-xl text-xl font-bold transition outline-none shadow-inner ${
                                                        isReviewMode
                                                            ? (isP3Correct(q) ? 'border-green-500 bg-green-50 text-green-700' : 'border-red-500 bg-red-50 text-red-700')
                                                            : 'border-gray-300 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 bg-white'
                                                    }`} />
                                                    {!isReviewMode && <p className="text-sm text-gray-500 mt-3 font-medium bg-gray-100 inline-block px-3 py-1 rounded-lg"><i className="fas fa-info-circle mr-1 text-indigo-500"></i> Có thể sử dụng dấu chấm (.) hoặc phẩy (,) cho số thập phân.</p>}
                                                </div>
                                                {isReviewMode && (
                                                    <div className="w-full md:w-auto p-4 bg-green-50 border border-green-200 rounded-xl inline-block shadow-sm">
                                                        <span className="font-bold text-green-800 block text-xs uppercase mb-1"><i className="fas fa-check-circle mr-1"></i> ĐÁP ÁN CHÍNH XÁC: </span>
                                                        <span className="text-green-700 font-black text-2xl">{q.shortAnswer}</span>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {isReviewMode && q.solutionLink && (
                                            <div className="mt-5 pt-5 border-t border-gray-200">
                                                <a href={q.solutionLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center px-5 py-2.5 bg-blue-50 text-blue-700 font-bold rounded-xl hover:bg-blue-100 transition border border-blue-200 shadow-sm group">
                                                    <i className="fas fa-play-circle mr-2 text-2xl group-hover:scale-110 transition-transform"></i> Xem hướng dẫn giải câu này
                                                </a>
                                            </div>
                                        )}
                                    </div>
                                ))}
                                {(quiz.questions?.[activeTab] || []).length === 0 && <div className="text-center text-gray-400 py-16 italic text-lg border-2 border-dashed rounded-2xl">Phần này không có câu hỏi nào.</div>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const StudentView = ({ user, classTree, setClassTree, lessonTree, onLogout }) => {
            const [activeChapter, setActiveChapter] = useState(null);
            const [activeLesson, setActiveLesson] = useState(null);
            const [activeQuiz, setActiveQuiz] = useState(null);
            const [reviewQuiz, setReviewQuiz] = useState({ isOpen: false, quiz: null, answers: null });

            const grade = user.grade;
            const chapters = lessonTree[grade] || {};
            const studentObj = classTree[user.grade]?.[user.cls]?.find(s => s.id === user.studentId);
            const quizResults = studentObj?.results || {};

            let totalAssigned = 0;
            Object.values(chapters).forEach(lessons => {
                lessons.forEach(lesson => {
                    (lesson.quizzes || []).forEach(q => {
                        if (!q.assignedClasses || q.assignedClasses.length === 0 || q.assignedClasses.includes(user.cls)) {
                            totalAssigned++;
                        }
                    });
                });
            });

            const attempted = Object.keys(quizResults).length;
            const pending = Math.max(0, totalAssigned - attempted);
            
            let avgScore10 = 0;
            if (attempted > 0) {
                let totalScore = 0;
                Object.values(quizResults).forEach(res => {
                    totalScore += res.highest;
                });
                avgScore10 = totalScore / attempted;
            }

            let rank = "Chưa xếp loại";
            if (attempted > 0) {
                if (avgScore10 >= 8) rank = "Giỏi";
                else if (avgScore10 >= 6.5) rank = "Khá";
                else if (avgScore10 >= 5) rank = "Trung bình";
                else rank = "Yếu";
            }

            const handleQuizComplete = (result) => {
                const newTree = { ...classTree };
                const clsStudents = newTree[user.grade][user.cls];
                const studentIdx = clsStudents.findIndex(s => s.id === user.studentId);
                if (studentIdx > -1) {
                    const s = clsStudents[studentIdx];
                    if (!s.results) s.results = {};
                    
                    const existingResult = s.results[result.quizId] || { attempts: 0, scores: [], highest: 0, times: [] };
                    const currentScore10 = (result.score / result.maxScore) * 10;
                    
                    existingResult.attempts += 1;
                    existingResult.scores.push(currentScore10);
                    existingResult.highest = Math.max(existingResult.highest || 0, currentScore10);
                    existingResult.latestAnswers = result.answers;
                    
                    const now = new Date();
                    existingResult.times.push(`Lần ${existingResult.attempts}: ${currentScore10.toFixed(1)}đ (${now.getDate()}/${now.getMonth()+1})`);
                    
                    s.results[result.quizId] = existingResult;
                    setClassTree(newTree);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col animate-fadeIn">
                    <div className="bg-indigo-700 text-white shadow-lg z-10 relative">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
                            <h1 className="font-black text-xl md:text-2xl flex items-center tracking-tight"><div className="bg-white text-indigo-700 p-2 rounded-lg mr-3 shadow-sm"><i className="fas fa-graduation-cap"></i></div> Học Vật Lý Tương Tác</h1>
                            <div className="flex items-center space-x-3 md:space-x-5 bg-indigo-800 p-2 rounded-xl border border-indigo-600 shadow-inner">
                                <div className="flex items-center font-bold px-2">
                                    <div className="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center mr-2 border-2 border-indigo-400"><i className="fas fa-user text-sm"></i></div>
                                    <span className="hidden sm:inline-block">{user.name} <span className="opacity-70 font-medium">({user.cls})</span></span>
                                </div>
                                <div className="h-6 w-px bg-indigo-600 hidden sm:block"></div>
                                <button onClick={onLogout} className="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-bold transition shadow-md flex items-center"><i className="fas fa-sign-out-alt sm:mr-2"></i> <span className="hidden sm:inline">Thoát</span></button>
                            </div>
                        </div>
                        
                        <div className="bg-indigo-900/60 border-t border-indigo-600/50 px-4 py-3">
                            <div className="max-w-7xl mx-auto flex flex-wrap gap-3 md:gap-8 justify-center md:justify-start text-sm">
                                <div className="flex items-center bg-indigo-800/80 px-4 py-1.5 rounded-full border border-indigo-700/50" title="Số lượng đề thi bạn đã hoàn thành"><i className="fas fa-check-circle mr-2 text-green-400"></i> Đã làm: <span className="font-bold text-white ml-2 text-base">{attempted}</span><span className="text-indigo-300 text-xs ml-1">/{totalAssigned}</span></div>
                                <div className="flex items-center bg-indigo-800/80 px-4 py-1.5 rounded-full border border-indigo-700/50" title="Số lượng đề thi được giao nhưng chưa làm"><i className="fas fa-clock mr-2 text-yellow-400"></i> Chưa làm: <span className="font-bold text-white ml-2 text-base">{pending}</span></div>
                                <div className="flex items-center bg-indigo-800/80 px-4 py-1.5 rounded-full border border-indigo-700/50" title="Điểm trung bình quy đổi về hệ 10"><i className="fas fa-star mr-2 text-orange-400"></i> Điểm TB: <span className="font-bold text-white ml-2 text-base">{attempted > 0 ? avgScore10.toFixed(1) : '-'}</span></div>
                                <div className="flex items-center bg-indigo-800/80 px-4 py-1.5 rounded-full border border-indigo-700/50"><i className="fas fa-award mr-2 text-purple-400"></i> Xếp loại: <span className="font-bold text-yellow-300 ml-2 uppercase tracking-wide">{rank}</span></div>
                            </div>
                        </div>
                    </div>
                    
                    <div className="bg-gradient-to-r from-blue-500 to-indigo-600 text-white marquee-container py-3 shadow-md">
                        <div className="marquee-content text-sm md:text-base tracking-wide flex items-center">
                            <span className="mr-8">🚀 Chào mừng <span className="font-black text-yellow-300">{user.name}</span> đến với hệ thống học tập trực tuyến!</span>
                            <span className="mr-8">📚 Hãy ôn luyện thật kỹ lý thuyết trước khi làm bài kiểm tra.</span>
                            <span className="mr-8">💡 Làm lại bài nhiều lần để cải thiện điểm số và nắm vững kiến thức nhé! Chúc bạn học tốt!</span>
                        </div>
                    </div>

                    <div className="flex-1 max-w-7xl mx-auto w-full p-4 md:p-6 flex flex-col lg:flex-row gap-6">
                        <div className="w-full lg:w-1/3 bg-white rounded-2xl shadow-sm border p-5 h-fit flex flex-col">
                            <h3 className="font-black text-xl mb-5 text-indigo-900 border-b-2 border-indigo-50 pb-3 flex items-center"><div className="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-lg flex justify-center items-center mr-3"><i className="fas fa-list-ul"></i></div> Chương trình {grade}</h3>
                            <div className="space-y-4">
                                {Object.keys(chapters).map((chap, cIdx) => (
                                    <div key={chap} className="border border-gray-200 rounded-xl overflow-hidden transition shadow-sm">
                                        <div onClick={()=>setActiveChapter(activeChapter===chap?null:chap)} className={`px-5 py-4 font-bold cursor-pointer flex justify-between items-center transition ${activeChapter===chap ? 'bg-indigo-600 text-white' : 'bg-gray-50 text-gray-800 hover:bg-gray-100'}`}>
                                            <span className="flex-1 pr-2 truncate flex items-center"><div className={`w-6 h-6 rounded-md flex items-center justify-center mr-3 text-sm ${activeChapter===chap ? 'bg-white/20' : 'bg-yellow-100 text-yellow-600'}`}>{cIdx+1}</div> {chap}</span>
                                            <div className={`w-6 h-6 rounded-full flex items-center justify-center transition ${activeChapter===chap ? 'bg-white/20 text-white rotate-180' : 'bg-white text-gray-400 shadow-sm border'}`}><i className="fas fa-chevron-down text-xs"></i></div>
                                        </div>
                                        {activeChapter === chap && (
                                            <div className="p-3 bg-white space-y-2 border-t border-gray-100">
                                                {chapters[chap].map((lesson, lIdx) => (
                                                    <div key={lesson.id} onClick={()=>setActiveLesson(lesson)} className={`px-4 py-3 text-sm rounded-xl cursor-pointer transition flex items-center border ${activeLesson?.id === lesson.id ? 'bg-indigo-50 border-indigo-200 font-bold text-indigo-700 shadow-sm' : 'border-transparent hover:bg-gray-50 hover:border-gray-200 text-gray-700'}`}>
                                                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center mr-3 transition ${activeLesson?.id === lesson.id ? 'bg-indigo-200 text-indigo-700' : 'bg-gray-100 text-gray-400'}`}><i className="fas fa-file-alt"></i></div> 
                                                        <span className="flex-1 truncate leading-tight">Bài {lIdx+1}: {lesson.name}</span>
                                                    </div>
                                                ))}
                                                {chapters[chap].length === 0 && <div className="text-sm text-gray-400 italic p-4 text-center border-2 border-dashed rounded-xl m-2">Chương này chưa có bài học</div>}
                                            </div>
                                        )}
                                    </div>
                                ))}
                                {Object.keys(chapters).length === 0 && (
                                    <div className="text-center py-10 bg-gray-50 rounded-xl border border-dashed">
                                        <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center text-gray-300 mx-auto mb-3 shadow-sm"><i className="fas fa-folder-open text-2xl"></i></div>
                                        <p className="text-gray-500 font-medium">Giáo viên chưa cập nhật chương trình.</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="w-full lg:w-2/3 bg-white rounded-2xl shadow-sm border p-5 md:p-8 flex flex-col h-fit lg:min-h-[calc(100vh-200px)]">
                            {activeLesson ? (
                                <div className="animate-fadeIn space-y-8">
                                    <div className="border-b-2 border-indigo-50 pb-5">
                                        <span className="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 font-bold text-xs rounded-lg mb-3 uppercase tracking-wider">{activeLesson.chapter}</span>
                                        <h2 className="text-2xl md:text-3xl font-black text-gray-800 leading-tight">{activeLesson.name}</h2>
                                    </div>
                                    
                                    <div className="bg-gradient-to-br from-blue-50 to-blue-100/50 rounded-2xl border border-blue-200 overflow-hidden shadow-sm">
                                        <div className="p-5 flex justify-between items-center border-b border-blue-200/50 bg-white/50">
                                            <h4 className="font-black text-blue-900 text-lg flex items-center"><div className="w-10 h-10 bg-blue-200 text-blue-700 rounded-xl flex items-center justify-center mr-3"><i className="fas fa-book-open"></i></div> 1. Tài liệu Học tập</h4>
                                        </div>
                                        <div className="p-5 grid gap-3">
                                            {(activeLesson.theoryLinks||[]).map(link => (
                                                <a key={link.id} href={link.url} target="_blank" rel="noopener noreferrer" className="flex items-center p-4 border border-blue-200/60 rounded-xl bg-white hover:shadow-md hover:border-blue-400 transition font-medium text-gray-700 group">
                                                    <div className="w-10 h-10 bg-blue-50 text-blue-500 rounded-lg flex items-center justify-center mr-4 group-hover:bg-blue-600 group-hover:text-white transition"><i className="fas fa-link"></i></div>
                                                    <span className="flex-1 group-hover:text-blue-700 transition">{link.title}</span>
                                                    <div className="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-blue-100 group-hover:text-blue-600 transition"><i className="fas fa-external-link-alt text-sm"></i></div>
                                                </a>
                                            ))}
                                            {(!activeLesson.theoryLinks || activeLesson.theoryLinks.length === 0) && <div className="text-center py-6 bg-white/50 rounded-xl border border-dashed border-blue-200"><p className="text-sm text-blue-400 font-medium italic">Không có tài liệu đính kèm cho bài này.</p></div>}
                                        </div>
                                    </div>

                                    <div className="bg-gradient-to-br from-orange-50 to-orange-100/50 rounded-2xl border border-orange-200 overflow-hidden shadow-sm">
                                        <div className="p-5 flex justify-between items-center border-b border-orange-200/50 bg-white/50">
                                            <h4 className="font-black text-orange-900 text-lg flex items-center"><div className="w-10 h-10 bg-orange-200 text-orange-700 rounded-xl flex items-center justify-center mr-3"><i className="fas fa-flask"></i></div> 2. Thí nghiệm Mô phỏng</h4>
                                        </div>
                                        <div className="p-5 grid gap-3">
                                            {(activeLesson.simLinks||[]).map(link => (
                                                <a key={link.id} href={link.url} target="_blank" rel="noopener noreferrer" className="flex items-center p-4 border border-orange-200/60 rounded-xl bg-white hover:shadow-md hover:border-orange-400 transition font-medium text-gray-700 group">
                                                    <div className="w-10 h-10 bg-orange-50 text-orange-500 rounded-lg flex items-center justify-center mr-4 group-hover:bg-orange-500 group-hover:text-white transition"><i className="fas fa-play ml-1"></i></div>
                                                    <span className="flex-1 group-hover:text-orange-700 transition">{link.title}</span>
                                                    <div className="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-orange-100 group-hover:text-orange-600 transition"><i className="fas fa-external-link-alt text-sm"></i></div>
                                                </a>
                                            ))}
                                            {(!activeLesson.simLinks || activeLesson.simLinks.length === 0) && <div className="text-center py-6 bg-white/50 rounded-xl border border-dashed border-orange-200"><p className="text-sm text-orange-400 font-medium italic">Không có thí nghiệm mô phỏng.</p></div>}
                                        </div>
                                    </div>

                                    <div className="bg-gradient-to-br from-indigo-50 to-indigo-100/50 rounded-2xl border border-indigo-200 overflow-hidden shadow-sm">
                                        <div className="p-5 flex justify-between items-center border-b border-indigo-200/50 bg-white/50">
                                            <h4 className="font-black text-indigo-900 text-lg flex items-center"><div className="w-10 h-10 bg-indigo-200 text-indigo-700 rounded-xl flex items-center justify-center mr-3"><i className="fas fa-pencil-ruler"></i></div> 3. Đề Ôn Tập & Kiểm Tra</h4>
                                        </div>
                                        <div className="p-5 grid gap-4">
                                            {(activeLesson.quizzes||[]).filter(q => !q.assignedClasses || q.assignedClasses.length === 0 || q.assignedClasses.includes(user.cls)).map((quiz) => {
                                                const currentResult = quizResults[quiz.id];
                                                const isCompleted = currentResult && currentResult.attempts > 0;
                                                return (
                                                    <div key={quiz.id} className="p-5 md:p-6 border border-indigo-200 rounded-2xl bg-white flex flex-col md:flex-row justify-between items-start md:items-center shadow-sm hover:shadow-md transition group gap-4 relative overflow-hidden">
                                                        {isCompleted && <div className="absolute top-0 right-0 bg-green-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg shadow-sm"><i className="fas fa-check mr-1"></i> Đã làm</div>}
                                                        
                                                        <div className="w-full md:w-auto flex-1">
                                                            <h5 className="font-bold text-xl text-gray-800 group-hover:text-indigo-700 transition pr-16">{quiz.title}</h5>
                                                            <div className="flex flex-wrap items-center gap-2 mt-3 text-sm text-gray-600 font-medium">
                                                                <span className="bg-gray-100 px-3 py-1.5 rounded-lg border border-gray-200 flex items-center"><div className="w-6 h-6 bg-white rounded flex items-center justify-center mr-2"><i className="far fa-clock text-indigo-500"></i></div> {quiz.timeLimit} phút</span>
                                                                <span className="bg-gray-100 px-3 py-1.5 rounded-lg border border-gray-200 flex items-center"><div className="w-6 h-6 bg-white rounded flex items-center justify-center mr-2"><i className="fas fa-list-ol text-blue-500"></i></div> {(quiz.questions?.part1?.length||0) + (quiz.questions?.part2?.length||0) + (quiz.questions?.part3?.length||0)} câu</span>
                                                            </div>
                                                            {isCompleted && (
                                                                <div className="mt-4 p-3 bg-green-50 border border-green-200 rounded-xl flex flex-wrap items-center gap-4">
                                                                    <div className="text-sm">
                                                                        <span className="block text-green-800 font-bold mb-1 opacity-70 uppercase text-xs">ĐIỂM CAO NHẤT</span>
                                                                        <span className="text-2xl font-black text-green-600">{currentResult.highest.toFixed(1)}</span><span className="text-green-600 font-bold">/10</span>
                                                                    </div>
                                                                    <div className="h-8 w-px bg-green-200 hidden sm:block"></div>
                                                                    <div className="text-sm">
                                                                        <span className="block text-green-800 font-bold mb-1 opacity-70 uppercase text-xs">SỐ LƯỢT THỬ</span>
                                                                        <span className="font-bold text-green-700">{currentResult.attempts} lần</span>
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                        <div className="flex flex-wrap gap-2 w-full md:w-auto mt-4 md:mt-0 justify-end">
                                                            {isCompleted && currentResult.latestAnswers && (
                                                                <button onClick={() => setReviewQuiz({isOpen: true, quiz: quiz, answers: currentResult.latestAnswers})} className="flex-1 md:flex-none shrink-0 text-indigo-700 bg-white border border-indigo-200 hover:bg-indigo-50 px-4 py-3 md:py-3.5 rounded-xl font-bold transition shadow-sm flex justify-center items-center text-sm md:text-base">
                                                                    <i className="fas fa-search mr-2"></i> Xem đáp án
                                                                </button>
                                                            )}
                                                            {isCompleted && quiz.generalSolutionLink && (
                                                                <a href={quiz.generalSolutionLink} target="_blank" rel="noopener noreferrer" className="flex-1 md:flex-none shrink-0 text-blue-700 bg-white border border-blue-200 hover:bg-blue-50 px-4 py-3 md:py-3.5 rounded-xl font-bold transition shadow-sm flex justify-center items-center text-sm md:text-base">
                                                                    <i className="fas fa-video mr-2"></i> Lời giải
                                                                </a>
                                                            )}
                                                            <button onClick={() => setActiveQuiz(quiz)} className={`w-full md:w-auto shrink-0 text-white px-6 py-3 md:py-3.5 rounded-xl font-bold transition shadow-md flex justify-center items-center text-sm md:text-base ${isCompleted ? 'bg-indigo-100 hover:bg-indigo-200 text-indigo-700 border border-indigo-300' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                                                                {isCompleted ? <><i className="fas fa-redo-alt mr-2"></i> Làm lại bài</> : <><i className="fas fa-pen-nib mr-2"></i> Bắt đầu làm</>}
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            {(!activeLesson.quizzes || activeLesson.quizzes.filter(q => !q.assignedClasses || q.assignedClasses.length === 0 || q.assignedClasses.includes(user.cls)).length === 0) && <div className="text-center py-8 bg-white/50 rounded-xl border border-dashed border-indigo-200"><p className="text-indigo-400 font-medium italic">Không có đề kiểm tra nào được giao.</p></div>}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center text-gray-400 py-16">
                                    <div className="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center border-2 border-gray-100 shadow-inner mb-6">
                                        <i className="fas fa-mouse-pointer text-4xl text-indigo-300"></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-gray-600 mb-2">Chưa chọn bài học</h3>
                                    <p className="font-medium text-center">Hãy chọn một bài học từ danh sách bên trái<br/>để xem tài liệu và làm bài tập nhé.</p>
                                </div>
                            )}
                        </div>
                    </div>
                    {activeQuiz && <StudentQuizPlayer quiz={activeQuiz} onClose={() => setActiveQuiz(null)} onComplete={handleQuizComplete} />}
                    {reviewQuiz.isOpen && <StudentQuizPlayer quiz={reviewQuiz.quiz} initialReviewMode={true} previousAnswers={reviewQuiz.answers} onClose={() => setReviewQuiz({isOpen: false, quiz: null, answers: null})} />}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [classTree, setClassTree] = useState(initialClassData);
            const [lessonTree, setLessonTree] = useState(initialLessonData);
            const [registeredStudents, setRegisteredStudents] = useState({});
            const [registeredTeachers, setRegisteredTeachers] = useState({"admin": "admin"});
            
            const [dataLoaded, setDataLoaded] = useState(false);
            const skipNextWrite = useRef(false);

            useEffect(() => {
                const unsub = db.collection("appData").doc("v2_real_data").onSnapshot((docSnap) => {
                    skipNextWrite.current = true;
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        if (data.classTree) setClassTree(data.classTree);
                        if (data.lessonTree) setLessonTree(data.lessonTree);
                        if (data.registeredStudents) setRegisteredStudents(data.registeredStudents);
                        if (data.registeredTeachers) setRegisteredTeachers(data.registeredTeachers);
                    } else {
                        db.collection("appData").doc("v2_real_data").set({
                            classTree: initialClassData,
                            lessonTree: initialLessonData,
                            registeredStudents: {},
                            registeredTeachers: {"admin": "admin"}
                        });
                    }
                    setDataLoaded(true);
                }, (error) => {
                    console.error("Lỗi đọc Firestore:", error);
                    setDataLoaded(true);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!dataLoaded) return;
                if (skipNextWrite.current) { skipNextWrite.current = false; return; }
                db.collection("appData").doc("v2_real_data").set({
                    classTree, lessonTree, registeredStudents, registeredTeachers
                }, { merge: true });
            }, [classTree, lessonTree, registeredStudents, registeredTeachers, dataLoaded]);

                      
            const [toast, setToast] = useState({ show: false, msg: "", type: "success" });
            const showToast = (msg, type="success") => { setToast({ show: true, msg, type }); setTimeout(() => setToast({ show: false, msg: "", type: "success" }), 3000); };

            const [forceChangePassUser, setForceChangePassUser] = useState(null);

            const handleLogin = (phone, pass, role) => {
                if (role === 'teacher') {
                    if ((phone === "admin" && pass === "admin") || pass === "00000000" || (registeredTeachers[phone] && registeredTeachers[phone] === pass)) {
                        setUser({ role: 'teacher' });
                    } else {
                        showToast("Sai thông tin đăng nhập Giáo viên!", "error");
                    }
                    return;
                }
                
                if (role === 'student') {
                    if (registeredStudents[phone]) {
                        if (registeredStudents[phone] === pass) {
                            setUser({ role: 'student', phone: phone, isFirstTime: true });
                        } else {
                            showToast("Sai mật khẩu!", "error");
                        }
                        return;
                    }

                    let foundAny = false;
                    for (const grade in classTree) {
                        for (const cls in classTree[grade]) {
                            if(classTree[grade][cls].some(s => s.phone === phone)) foundAny = true;
                        }
                    }
                    
                    if(foundAny) {
                        if (pass === "00000000") {
                            setForceChangePassUser({ role: 'student', phone: phone, isFirstTime: true });
                        } else {
                            showToast("Sai mật khẩu! Nếu chưa đổi mật khẩu, hãy dùng 00000000", "error");
                        }
                    } else {
                        showToast("Tài khoản chưa tồn tại! Vui lòng Đăng ký hoặc báo GV thêm vào lớp.", "error");
                    }
                }
            };

            const handleRegister = (phone, pass, role) => {
                if (role === 'teacher') {
                    if (registeredTeachers[phone] || phone === "admin") {
                        showToast("Tên đăng nhập này đã tồn tại!", "error");
                        return;
                    }
                    setRegisteredTeachers(prev => ({...prev, [phone]: pass}));
                    showToast("Đăng ký thành công! Đang tự động đăng nhập...", "success");
                    setUser({ role: 'teacher' });
                    return;
                }
                if (role === 'student') {
                    if (registeredStudents[phone]) {
                        showToast("Số điện thoại này đã được đăng ký!", "error");
                        return;
                    }
                    setRegisteredStudents(prev => ({...prev, [phone]: pass}));
                    showToast("Đăng ký thành công! Đang tự động đăng nhập...", "success");
                    setUser({ role: 'student', phone: phone, isFirstTime: true });
                }
            };

            const handleStudentChangePass = (newPass) => {
                if (!newPass || newPass.trim() === "") return showToast("Mật khẩu không được để trống!", "error");
